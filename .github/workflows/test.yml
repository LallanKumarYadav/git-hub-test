name: Test Project
on: push

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout latest code
        uses: actions/checkout@v7
      - name: install Node js Latest
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: install dependencies
        run: npm install
      - name: Run Test cases
        run: npm test  