name: Build and Deploy Application
on:
  push:

jobs:
  run-tests-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node js Latest
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run Test cases
        run: npm test    

  build-code-job:
    needs: [run-tests-job]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node js Latest
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build the project
        run: npm run build

  deploy-webapp-job:
    needs: build-code-job
    runs-on: ubuntu-latest
    steps:    
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node js Latest
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Deploy the web application
        run: echo 'Deploying the web application...'
