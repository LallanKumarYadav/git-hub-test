name: Events Test
on:
  pull_request:
    types:
      - closed
jobs:
  deploy-job:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout the latest code
      uses: actions/checkout@v7
    - name: Install Node js Latest
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'  
    - name: Install Dependencies
      run: npm install
    - name: Run Test cases
      run: npm test      